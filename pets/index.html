<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
    content="Learn more about each pet, view important details, and take the next step toward giving them a forever home.">

    <!-- Title -->
    <title>PetPals | Pet Details</title>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon/favicon-16x16.png">
    <link rel="manifest" href="../assets/icons/favicon/site.webmanifest">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/output.css">

    <!-- Scripts -->
</head>


<body>

    <header id="header"></header>

    <main>

        <section id="pet-details">

            <a href="../index.html">← Back to Home</a>

            <div>

                <div>
                    <img src="" alt="">
                </div>

                <div>

                    <div>
                        <h1 id="pet-name"></h1>

                        <div id="pet-tags"></div>
                    </div>

                    <section>
                        <div>
                            <h2>About <span id="about-pet-name"></span></h2>

                            <img src="" alt="">
                        </div>

                        <div>

                            <div>

                                <p>Breed</p>

                                <p id="pet-breed"></p>

                            </div>

                            <div>

                                <p>Age</p>

                                <p id="pet-age"></p>
                                
                            </div>

                            <div>

                                <p>Size</p>

                                <p id="pet-size"></p>
                                
                            </div>

                            <div>

                                <p>Gender</p>

                                <p id="pet-gender"></p>
                                
                            </div>

                        </div>

                    </section>

                    <div id="pet-actions">

                        <button 
                            id="share-button" 
                            type="button"
                            aria-label="Share pet"
                            title="Share">

                            <img src="../assets/icons/ui/share.svg" alt="">

                        </button>

                        <button id="adopt-button" type="button">Adopt</button>

                        <div id="admin-actions" hidden>
                            <a id="edit-pet-link" href="./edit/index.html">Edit</a>

                            <button id="delete-pet-button" type="button">Delete</button>
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>
    
    <footer id="footer"></footer>
    
</body>
</html>
