<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
    content="Create a PetPals account and help pets find their forever homes.">

    <!-- Title -->
    <title>PetPals | Register</title>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/icons/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/icons/favicon/favicon-16x16.png">
    <link rel="manifest" href="../../assets/icons/favicon/site.webmanifest">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="../../css/output.css">

    <!-- Scripts -->
     <script type="module" src="../../js/main.js"></script>
</head>


<body>

    <header id="header"></header>

    <main>

        <section id="register">

            <a href="../../index.html">← Back to Home</a>

            <div>

                <div>

                    <div>

                        <img src="" alt="">

                        <h1>Create an Account</h1>

                    </div>

                    <p>Create an account to manage pets and help them find loving homes</p>

                </div>

                <div>

                    <div>

                        <h2>Register</h2>

                        <p>Fill in the information below to create your account</p>

                    </div>

                

                    <form id="register-form">

                        <div>
                            <label for="name">Username</label>
                            <input 
                                id="name"
                                name="name"
                                type="text"
                                required
                                placeholder="Enter your username">
                        </div>

                        <div>
                            <label for="email">Email</label>
                            <input 
                                id="email"
                                name="email"    
                                type="text"
                                required
                                placeholder="Enter your email">
                        </div>

                        <div>
                            <label for="password">Password</label>
                            <input
                                id="password"
                                name="password"
                                type="password"
                                required
                                placeholder="Enter your password">
                        </div>

                        <div 
                            id="message-container"
                            class="mb-4"
                            aria-live="polite">

                            <img 
                                src="${style.icon}" 
                                alt=""
                                class="h-5 w-5">
                        </div>

                        <button type="submit">Register</button>

                    </form>

                

                    <p>Already have an account?
                        <a href="../login/index.html">Log In</a>
                    </p>

                </div>

            </div>

        </section>
        
    </main>
    
    <footer id="footer"></footer>
    
</body>
</html>
